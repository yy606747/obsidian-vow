<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>记忆库 - Obsidian Vow</title>
<link rel="stylesheet" href="/static/common.css">
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a1714">
<style>
.mem-tabs { display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:12px; }
.mem-tab { background:none; border:none; border-bottom:2px solid transparent; color:var(--text2); cursor:pointer; font-size:14px; padding:8px 12px; }
.mem-tab.active { color:var(--accent); border-bottom-color:var(--accent); font-weight:600; }
/* ── 誓约 tab ── */
.vow-add-row { display:flex; gap:8px; align-items:flex-start; margin-bottom:6px; }
.vow-add-row textarea { flex:1; min-height:52px; resize:vertical; }
.vow-input { background:rgba(0,0,0,.2); border:1px solid var(--border); border-radius:8px; color:var(--text); font-size:13px; padding:8px 10px; width:100%; box-sizing:border-box; }
.vow-add-btn { background:var(--accent); border:none; border-radius:8px; color:#1a1714; font-size:13px; font-weight:600; padding:10px 16px; cursor:pointer; }
.vow-hint { font-size:11px; color:var(--text3); margin-bottom:14px; }
.vow-section-title { font-size:13px; color:var(--text2); font-weight:600; margin:16px 0 8px; }
.vow-card { background:var(--surface); border:1px solid var(--border); border-left:2px solid rgba(212,148,58,.35); border-radius:10px; padding:12px 14px; margin-bottom:10px; }
.vow-card.fulfilled { opacity:.7; border-left-color:var(--border); }
.vow-content { font-size:14px; color:var(--text); line-height:1.6; white-space:pre-wrap; word-break:break-word; }
.vow-meta { font-size:11px; color:var(--text3); font-family:monospace; margin-top:6px; }
.vow-actions { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
.vow-btn { background:none; border:1px solid var(--border); border-radius:6px; color:var(--text2); font-size:12px; padding:4px 10px; cursor:pointer; }
.vow-btn:hover { border-color:var(--accent); color:var(--accent); }
.vow-btn.danger:hover { border-color:var(--danger); color:var(--danger); }
.vow-revise-form { display:flex; flex-direction:column; gap:6px; margin-top:10px; }
.vow-history { margin-top:8px; border-top:1px dashed var(--border); padding-top:8px; }
.vow-history-item { font-size:12px; color:var(--text3); line-height:1.6; margin-bottom:6px; }
.vow-history-item .vh-reason { color:var(--text2); }
.vow-load-row { display:flex; justify-content:center; margin:10px 0 4px; }
.vow-load-more { background:var(--surface2); color:var(--text2); border:1px solid var(--border); border-radius:6px; padding:6px 14px; font-size:12px; cursor:pointer; }
.vow-load-more:hover { color:var(--text); border-color:var(--accent); }
.vow-load-more:disabled { opacity:.55; cursor:not-allowed; }
.mem-panel { display:none; }
.mem-panel.active { display:block; }
.recall-form { border:1px solid var(--border); border-radius:8px; background:var(--surface); padding:10px; margin-bottom:10px; }
.recall-query { width:100%; min-height:86px; resize:vertical; background:var(--surface2); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:9px 10px; font-size:14px; line-height:1.5; font-family:inherit; outline:none; }
.recall-query:focus { border-color:var(--accent); }
.recall-grid { display:grid; grid-template-columns:1fr 1fr 86px; gap:8px; margin-top:8px; }
.recall-grid label { display:block; font-size:11px; color:var(--text3); margin-bottom:3px; }
.recall-grid input, .recall-grid select { width:100%; background:var(--surface2); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:7px 8px; font-size:12px; outline:none; }
.recall-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:10px; }
.recall-run { background:var(--accent); color:#fff; border:none; border-radius:6px; padding:7px 16px; font-size:13px; font-weight:600; cursor:pointer; }
.recall-run:disabled { opacity:0.5; cursor:not-allowed; }
.recall-secondary { background:var(--surface2); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:7px 12px; font-size:13px; cursor:pointer; }
.recall-output { display:flex; flex-direction:column; gap:10px; }
.recall-empty { border:1px dashed var(--border); border-radius:8px; padding:24px 12px; text-align:center; color:var(--text3); font-size:13px; background:var(--bg); }
.recall-section { border:1px solid var(--border); border-radius:8px; background:var(--surface); padding:10px; }
.recall-section h3 { font-size:13px; margin:0 0 8px; color:var(--text); }
.recall-summary { display:flex; flex-wrap:wrap; gap:6px; }
.recall-badge { display:inline-flex; align-items:center; gap:4px; max-width:100%; border:1px solid var(--border); background:var(--surface2); border-radius:6px; padding:4px 7px; font-size:11px; color:var(--text2); }
.recall-badge strong { color:var(--text); font-weight:600; }
.recall-badge.ok { border-color:rgba(46,125,50,0.25); background:rgba(46,125,50,0.08); }
.recall-badge.warn { border-color:rgba(230,81,0,0.25); background:rgba(230,81,0,0.08); }
.recall-step { border-top:1px solid var(--border); padding:7px 0; }
.recall-step:first-child { border-top:none; padding-top:0; }
.recall-step summary { cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:12px; color:var(--text); list-style:none; }
.recall-step summary::-webkit-details-marker { display:none; }
.recall-step-name { font-weight:600; }
.recall-step-status { color:var(--text3); font-size:11px; }
.recall-json { margin-top:7px; background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:8px; overflow:auto; max-height:220px; font-size:11px; line-height:1.45; color:var(--text2); white-space:pre-wrap; }
.recall-items { display:flex; flex-direction:column; gap:6px; }
.recall-item { border:1px solid var(--border); border-radius:8px; background:var(--bg); padding:8px; }
.recall-item-head { display:grid; grid-template-columns:64px 1fr; gap:8px; align-items:start; }
.recall-score { font-size:13px; font-weight:700; color:#e65100; font-variant-numeric:tabular-nums; }
.recall-score-bar { height:4px; border-radius:4px; background:var(--surface2); overflow:hidden; margin-top:4px; }
.recall-score-bar span { display:block; height:100%; background:var(--accent); width:0%; }
.recall-tags { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:4px; }
.recall-tag { border:1px solid var(--border); border-radius:4px; background:var(--surface); color:var(--text2); padding:1px 5px; font-size:10px; }
.recall-tag.ns { color:var(--accent); }
.recall-reason { color:var(--text3); font-size:11px; margin-bottom:4px; word-break:break-word; }
.recall-preview { color:var(--text); font-size:12px; line-height:1.55; word-break:break-word; }
.recall-raw details { border:1px solid var(--border); border-radius:8px; background:var(--surface); padding:8px 10px; }
.recall-raw summary { cursor:pointer; color:var(--text2); font-size:12px; }
.mem-filter-row { display:grid; grid-template-columns:1fr 128px; gap:8px; margin-bottom:8px; }
.mem-search { width:100%; background:var(--surface2); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:8px 10px; font-size:13px; outline:none; box-sizing:border-box; }
.mem-filter-select { width:100%; background:var(--surface2); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:8px 9px; font-size:13px; outline:none; box-sizing:border-box; }
.mem-list { flex:1; overflow-y:auto; max-height:calc(100dvh - 320px); border:1px solid var(--border); border-radius:10px; background:linear-gradient(180deg, var(--bg) 0%, rgba(26,23,20,0.95) 100%); padding:4px; box-shadow: inset 0 1px 0 rgba(212,148,58,0.05); }
.mem-entry { padding:9px 10px; border-bottom:1px solid rgba(58,53,48,0.4); font-size:13px; line-height:1.5; display:flex; align-items:flex-start; gap:8px; border-radius:6px; transition: background 0.2s; }
.mem-entry:hover { background: rgba(212,148,58,0.03); }
.mem-entry:last-child { border-bottom:none; }
.mem-type { font-size:10px; padding:2px 6px; border-radius:4px; background:var(--surface2); color:var(--accent); white-space:nowrap; flex-shrink:0; margin-top:2px; }
.mem-left { display:flex; flex-direction:column; align-items:center; gap:3px; flex-shrink:0; margin-top:2px; }
.mem-imp { font-size:10px; color:var(--text3); font-weight:600; }
.mem-meta { display:flex; align-items:center; gap:6px; margin-top:3px; flex-wrap:wrap; }
.mem-kw { font-size:10px; color:var(--accent); opacity:0.85; }
.mem-time { font-size:10px; color:var(--text3); }
.mem-content { flex:1; color:var(--text); word-break:break-word; }
.mem-content-edit { flex:1; background:var(--surface2); color:var(--text); border:1px solid var(--accent); border-radius:4px; padding:8px 10px; font-size:14px; font-family:inherit; resize:vertical; min-height:50vh; line-height:1.5; width:100%; box-sizing:border-box; }
.mem-actions { display:flex; gap:4px; flex-shrink:0; margin-top:2px; }
.mem-actions button { background:none; border:none; cursor:pointer; font-size:14px; padding:2px; opacity:0.6; }
.mem-actions button:hover { opacity:1; }
.mem-pin { transition: opacity 0.15s; }
.mem-pin.active { opacity:1 !important; }
.mem-entry.mem-unresolved { background:rgba(255,152,0,0.08); border-left:2px solid #ff9800; }
.mem-empty { padding:40px 24px; text-align:center; color:var(--text3); font-size:14px; line-height:1.8; }
.mem-add-row { display:flex; gap:6px; margin-top:8px; }
.mem-add-row input { flex:1; background:var(--surface2); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:6px 10px; font-size:13px; outline:none; }
.mem-add-row select { background:var(--surface2); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:6px 8px; font-size:12px; outline:none; }
.mem-add-row button { background:var(--accent); color:#fff; border:none; border-radius:6px; padding:6px 14px; font-size:13px; cursor:pointer; font-weight:600; white-space:nowrap; }
.mem-count { font-size:11px; color:var(--text3); margin-bottom:4px; }
.mem-load-row { display:flex; justify-content:center; padding:8px 0 2px; }
.mem-load-more { display:none; background:var(--surface2); color:var(--text2); border:1px solid var(--border); border-radius:6px; padding:7px 18px; font-size:13px; cursor:pointer; }
.mem-load-more:hover { color:var(--text); border-color:var(--accent); }
.mem-load-more:disabled { opacity:0.55; cursor:not-allowed; }
.btn-digest { background:#4a8a50; color:#fff; border:none; border-radius:6px; padding:6px 14px; font-size:13px; cursor:pointer; font-weight:600; white-space:nowrap; }
.btn-digest:hover { background:#5a9a60; }
.btn-digest:disabled { background:var(--surface2); color:var(--text3); cursor:not-allowed; }
.digest-status { margin-top:8px; padding:8px 12px; border-radius:6px; font-size:12px; line-height:1.5; }
.digest-status.success { background:rgba(74,138,80,0.15); color:#7aad6a; }
.digest-status.info { background:rgba(100,181,246,0.15); color:#64b5f6; }
.digest-status.error { background:rgba(207,34,46,0.15); color:#ef9a9a; }
.mem-source-btn { background:none; border:none; cursor:pointer; font-size:12px; padding:2px; opacity:0.6; color:var(--accent); }
.mem-source-btn:hover { opacity:1; }
.anchor-row { display:flex; align-items:center; gap:8px; margin-top:8px; padding:6px 0; border-top:1px solid var(--border); font-size:12px; }
.anchor-label { color:var(--text2); white-space:nowrap; }
.anchor-label span { color:var(--accent); }
.anchor-input { background:var(--surface2); color:var(--text); border:1px solid var(--border); border-radius:4px; padding:3px 6px; font-size:12px; outline:none; }
.anchor-reset-btn { background:#e65100; color:#fff; border:none; border-radius:4px; padding:3px 10px; font-size:12px; cursor:pointer; white-space:nowrap; }
/* 原文弹窗 */
.source-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:20; align-items:center; justify-content:center; }
.source-overlay.show { display:flex; }
.source-modal { background:var(--surface); border-radius:12px; width:90%; max-width:500px; padding:20px; max-height:80vh; overflow-y:auto; }
.source-msg { padding:8px 10px; border-bottom:1px solid var(--border); font-size:13px; line-height:1.5; }
.source-msg:last-child { border-bottom:none; }
.source-name { font-weight:600; color:var(--accent); margin-right:6px; font-size:12px; }
.source-time { font-size:10px; color:var(--text3); }
@media (max-width: 768px) {
  .mem-entry { flex-direction:column; gap:4px; padding:10px 8px; position:relative; }
  .mem-left { flex-direction:row; gap:6px; }
  .mem-actions { position:absolute; top:8px; right:6px; }
  .mem-add-row { flex-wrap:wrap; }
  .mem-add-row input { flex-basis:100%; }
  .mem-add-row select { flex:1; }
  .mem-filter-row { grid-template-columns:1fr; }
  .anchor-row { flex-wrap:nowrap; gap:6px; overflow-x:auto; }
  .recall-grid { grid-template-columns:1fr; }
  .recall-actions { justify-content:stretch; }
  .recall-actions button { flex:1; }
  .recall-item-head { grid-template-columns:1fr; gap:6px; }
  .recall-score { display:flex; align-items:center; gap:8px; }
  .recall-score-bar { flex:1; margin-top:0; }
}
/* 聚焦编辑模式 */
.editing-focus .mem-tabs,
.editing-focus .mem-filter-row,
.editing-focus .mem-count,
.editing-focus .mem-load-row,
.editing-focus .mem-add-row,
.editing-focus .anchor-row,
.editing-focus .digest-status,
.editing-focus .btn-row,
.editing-focus .top-bar { display:none !important; }
.editing-focus .mem-list { max-height:none; border:none; overflow:visible; }
.editing-focus .mem-entry:not(.mem-editing) { display:none !important; }
.editing-focus .mem-entry.mem-editing { border:none; }
.editing-focus .page-content { padding-top:12px; }
</style>
</head>
<body>
<div class="sub-page">
  <div class="top-bar">
    <button class="back-btn" onclick="location.href='/'">⬅</button>
    <h2>🧠 记忆库</h2>
  </div>
  <div class="page-content">
    <div class="mem-tabs">
      <button class="mem-tab active" data-mem-tab="list" onclick="switchMemoryPanel('list')">记忆列表</button>
      <button class="mem-tab" data-mem-tab="vows" onclick="switchMemoryPanel('vows')">誓约</button>
      <button class="mem-tab" data-mem-tab="debug" onclick="switchMemoryPanel('debug')">召回调试</button>
    </div>

    <div class="mem-panel active" data-mem-panel="list">
      <div class="mem-filter-row">
        <input class="mem-search" id="memSearch" type="text" placeholder="🔍 搜索记忆..." oninput="filterMemories()">
        <select class="mem-filter-select" id="memTypeFilter" onchange="reloadMemories()">
          <option value="">全部类型</option>
          <option value="digest_note">记忆摘要</option>
          <option value="ai_note">AI笔记</option>
          <option value="unresolved">待解决</option>
        </select>
      </div>
      <div class="mem-count" id="memCount"></div>
      <div class="mem-list" id="memList"><div class="mem-empty">暂无记忆</div></div>
      <div class="mem-load-row"><button class="mem-load-more" id="memLoadMore" onclick="loadMoreMemories()">加载更多</button></div>
      <div class="mem-add-row">
      <input type="text" id="memAddInput" placeholder="手动添加一条记忆...">
      <select id="memAddType">
        <option value="shared_moment">共同经历</option>
        <option value="emotion">情感时刻</option>
        <option value="life_event">重要事件</option>
        <option value="preference">喜好/雷区</option>
        <option value="promise">约定承诺</option>
        <option value="milestone">关系里程碑</option>
      </select>
      <button onclick="addMemory()">添加</button>
    </div>
    <div class="anchor-row">
      <span class="anchor-label">📌 总结锚点：<span id="anchorDate">--</span></span>
      <input type="date" id="anchorDateInput" class="anchor-input">
      <button class="anchor-reset-btn" onclick="resetAnchor()">回退</button>
    </div>
    <div class="digest-status" id="digestStatus" style="display:none"></div>
      <div class="btn-row">
        <button class="btn-digest" id="digestBtn" onclick="triggerDigest()">📝 总结新记忆</button>
      </div>
    </div>

    <div class="mem-panel" data-mem-panel="debug">
      <div class="recall-form">
        <textarea class="recall-query" id="recallQuery" placeholder="输入一句要测试召回的话..."></textarea>
        <div class="recall-grid">
          <div>
            <label>mode</label>
            <select id="recallMode">
              <option value="normal">normal</option>
              <option value="intimate">intimate</option>
            </select>
          </div>
          <div>
            <label>namespace</label>
            <select id="recallNamespace">
              <option value="">auto</option>
              <option value="normal">normal</option>
              <option value="work">work</option>
              <option value="schedule">schedule</option>
              <option value="location">location</option>
              <option value="health">health</option>
              <option value="device">device</option>
              <option value="intimate">intimate</option>
            </select>
          </div>
          <div>
            <label>top_k</label>
            <input id="recallTopK" type="number" min="1" max="20" step="1" value="8">
          </div>
        </div>
        <label class="form-label" style="margin-top:8px">keywords</label>
        <input class="form-input" id="recallKeywords" placeholder="逗号或空格分隔，可留空">
        <div class="recall-actions">
          <button class="recall-secondary" onclick="fillRecallExample()">示例</button>
          <button class="recall-run" id="recallRunBtn" onclick="runRecallDebug()">运行</button>
        </div>
      </div>
      <div class="recall-output" id="recallOutput">
        <div class="recall-empty">输入 query 后运行 trace</div>
      </div>
    </div>

    <div class="mem-panel" data-mem-panel="vows">
      <div class="vow-add-row">
        <textarea class="vow-input" id="vowAddInput" maxlength="240" placeholder="写下一条一年后你们仍希望它为真的约定..."></textarea>
        <button class="vow-add-btn" id="vowAddBtn" onclick="createVow()">立约</button>
      </div>
      <div class="vow-hint">修订和退役都要写原因；誓约没有原地编辑，每次修订都会留下版本史。</div>
      <div class="vow-section-title">🕯️ 有效誓约 <span id="vowActiveCount"></span></div>
      <div id="vowActiveList"><div class="mem-empty">还没有誓约</div></div>
      <div class="vow-section-title">✅ 已经兑现</div>
      <div id="vowFulfilledList"><div class="mem-empty">还没有兑现的誓约</div></div>
    </div>
  </div>
</div>

<!-- 原文查看弹窗 -->
<div class="source-overlay" id="sourceOverlay" onclick="if(event.target===this)closeSource()">
  <div class="source-modal">
    <h3>📜 原文记录</h3>
    <div id="sourceList" style="max-height:60vh;overflow-y:auto"><div class="mem-empty">加载中...</div></div>
    <div class="btn-row"><button class="btn-cancel" onclick="closeSource()">关闭</button></div>
  </div>
</div>

<script src="/static/common.js"></script>
<script src="/static/web_push.js"></script>
<script>
const MEM_TYPE_LABELS = {
  shared_moment:"共同经历", emotion:"情感时刻", life_event:"重要事件",
  preference:"喜好/雷区", promise:"约定承诺", milestone:"关系里程碑",
  event:"事件", digest:"总结", ai_note:"AI笔记", digest_note:"记忆摘要", v2_note:"V2记忆"
};
const MEM_PAGE_LIMIT = 100;
let _allMemories = [];
let _memOffset = 0;
let _memHasMore = false;
let _memLoading = false;
let _memSearchTimer = null;

connectCommonWS(msg => {
  if (msg.type === "memory_added") {
    prependMemory(msg.data);
  } else if (msg.type === "vow_changed" && (_vowsLoaded || _vowLoading)) {
    // AI 立约、其他设备操作、删消息撤约……都靠这个事件保持管理页新鲜。
    // 首次加载在途时也要排队补拉（loadVows 单飞机制），不能丢事件
    loadVows();
  }
});

(async function init() {
  await loadMemories();
  loadAnchor();
  if (location.hash === '#debug') switchMemoryPanel('debug');
  else if (location.hash === '#vows') switchMemoryPanel('vows');
})();

async function loadMemories() {
  return reloadMemories();
}

function memoryQueryParams() {
  const params = new URLSearchParams();
  params.set("limit", String(MEM_PAGE_LIMIT));
  params.set("offset", String(_memOffset));
  const q = ($("memSearch").value || "").trim();
  if (q) params.set("q", q);
  const type = $("memTypeFilter").value || "";
  if (type === "unresolved") params.set("unresolved", "1");
  else if (type) params.set("type", type);
  return params;
}

function hasActiveMemoryFilter() {
  return Boolean(($("memSearch").value || "").trim() || ($("memTypeFilter").value || ""));
}

async function reloadMemories() {
  return fetchMemoryPage({ reset: true });
}

async function loadMoreMemories() {
  if (!_memHasMore || _memLoading) return;
  return fetchMemoryPage({ reset: false });
}

async function fetchMemoryPage({ reset } = { reset: true }) {
  if (_memLoading) return;
  if (reset) {
    _memOffset = 0;
    _memHasMore = false;
    _allMemories = [];
    renderMemories();
  }
  _memLoading = true;
  updateMemoryLoadMore();
  try {
    const page = await api("GET", `/api/memories?${memoryQueryParams().toString()}`);
    const items = Array.isArray(page) ? page : (page.items || []);
    if (reset) {
      _allMemories = items;
    } else {
      const seen = new Set(_allMemories.map(m => m.id));
      _allMemories.push(...items.filter(m => !seen.has(m.id)));
    }
    if (Array.isArray(page)) {
      _memHasMore = false;
      _memOffset = _allMemories.length;
    } else {
      _memHasMore = Boolean(page.has_more);
      _memOffset = page.next_offset ?? _allMemories.length;
    }
    renderMemories();
  } catch(e) {
    if (reset) $("memList").innerHTML = '<div class="mem-empty">加载失败</div>';
    else showToast("加载更多失败");
  } finally {
    _memLoading = false;
    updateMemoryLoadMore();
  }
}

function filterMemories() {
  clearTimeout(_memSearchTimer);
  _memSearchTimer = setTimeout(() => reloadMemories(), 250);
}

function updateMemoryLoadMore() {
  const btn = $("memLoadMore");
  if (!btn) return;
  btn.style.display = (_memHasMore || _memLoading) ? "inline-flex" : "none";
  btn.disabled = _memLoading;
  btn.textContent = _memLoading ? "加载中..." : "加载更多";
}

function prependMemory(mem) {
  if (!mem) return;
  if (hasActiveMemoryFilter()) {
    reloadMemories();
    return;
  }
  _allMemories = [mem, ..._allMemories.filter(item => item.id !== mem.id)];
  if (_allMemories.length > _memOffset && _memHasMore) _allMemories.pop();
  _memOffset = _allMemories.length;
  renderMemories();
}

function renderMemories() {
  const query = ($("memSearch").value || "").trim();
  const type = $("memTypeFilter").value || "";
  const filterText = query || type ? "，当前为筛选结果" : "";
  $("memCount").textContent = _memLoading && !_allMemories.length
    ? "加载中..."
    : `已加载 ${_allMemories.length} 条记忆${_memHasMore ? "，还有更多" : ""}${filterText}`;
  const el = $("memList");
  if (!_allMemories.length) {
    el.innerHTML = `<div class="mem-empty">${query || type ? "暂无匹配记忆" : "暂无记忆"}</div>`;
    return;
  }
  el.innerHTML = _allMemories.map(m => {
    const typeLabel = MEM_TYPE_LABELS[m.type] || m.type;
    const timeStr = m.created_at ? new Date(m.created_at * 1000).toLocaleString("zh-CN", {month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}) : "";
    const hasSource = m.source_start_ts && m.source_end_ts;
    const sourceBtn = hasSource ? `<button class="mem-source-btn" onclick="viewSource('${escHtml(m.id)}')" title="查看原文">📜</button>` : '';
    let kwDisplay = '';
    try {
      const kws = m.keywords ? (typeof m.keywords === 'string' ? JSON.parse(m.keywords) : m.keywords) : [];
      if (kws.length) kwDisplay = `<span class="mem-kw">${kws.map(k => escHtml(k)).join(' · ')}</span>`;
    } catch(e) { if (m.keywords) kwDisplay = `<span class="mem-kw">${escHtml(m.keywords)}</span>`; }
    const impDisplay = m.importance != null ? `<span class="mem-imp" title="重要度">${Number(m.importance).toFixed(1)}</span>` : '';
    const pinClass = m.unresolved ? 'mem-pin active' : 'mem-pin';
    return `<div class="mem-entry${m.unresolved ? ' mem-unresolved' : ''}" data-id="${escHtml(m.id)}">
      <div class="mem-left"><span class="mem-type">${escHtml(typeLabel)}</span>${impDisplay}</div>
      <div style="flex:1;min-width:0">
        <div class="mem-content" id="mc_${escHtml(m.id)}">${escHtml(m.content)}</div>
        <div class="mem-meta">${kwDisplay}<span class="mem-time">${escHtml(timeStr)}</span></div>
      </div>
      <div class="mem-actions">
        <button class="${pinClass}" onclick="toggleUnresolved('${escHtml(m.id)}')" title="标记待办">📌</button>
        ${sourceBtn}
        <button onclick="editMemory('${escHtml(m.id)}')" title="编辑">✏️</button>
        <button onclick="deleteMemory('${escHtml(m.id)}')" title="删除">🗑️</button>
      </div>
    </div>`;
  }).join("");
}

function editMemory(id) {
  const mem = _allMemories.find(m => m.id === id);
  if (!mem) return;
  const entry = document.querySelector(`.mem-entry[data-id="${id}"]`);
  if (!entry) return;
  let kws = '';
  try { const arr = mem.keywords ? (typeof mem.keywords === 'string' ? JSON.parse(mem.keywords) : mem.keywords) : []; kws = arr.join(', '); } catch(e) { kws = mem.keywords || ''; }
  const imp = mem.importance != null ? Number(mem.importance).toFixed(1) : '0.5';
  // 进入聚焦编辑模式
  document.querySelector('.sub-page').classList.add('editing-focus');
  entry.classList.add('mem-editing');
  entry.innerHTML = `
    <div style="flex:1;display:flex;flex-direction:column;gap:8px;padding:4px 0">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:13px;color:var(--text2);font-weight:600">✏️ 编辑记忆</span>
        <button onclick="cancelEdit()" style="background:none;border:none;color:var(--text3);font-size:20px;cursor:pointer;padding:0 4px">✕</button>
      </div>
      <textarea class="mem-content-edit" id="me_${escHtml(id)}">${escHtml(mem.content)}</textarea>
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
        <label style="font-size:11px;color:var(--text2)">关键词:</label>
        <input type="text" id="mk_${escHtml(id)}" value="${escHtml(kws)}" placeholder="逗号分隔" style="flex:1;min-width:120px;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:3px 6px;font-size:12px;outline:none">
        <label style="font-size:11px;color:var(--text2)">重要度:</label>
        <input type="number" id="mi_${escHtml(id)}" value="${imp}" min="0" max="1" step="0.1" style="width:50px;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:3px 6px;font-size:12px;outline:none">
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button onclick="cancelEdit()" style="background:var(--surface2);color:var(--text2);border:1px solid var(--border);border-radius:4px;padding:6px 16px;cursor:pointer;font-size:13px">取消</button>
        <button onclick="saveMemoryEdit('${escHtml(id)}')" style="background:var(--accent);color:#fff;border:none;border-radius:4px;padding:6px 16px;cursor:pointer;font-size:13px;font-weight:600">保存</button>
      </div>
    </div>`;
  document.getElementById("me_" + id).focus();
}

function cancelEdit() {
  document.querySelector('.sub-page').classList.remove('editing-focus');
  const editingEntry = document.querySelector('.mem-editing');
  if (editingEntry) editingEntry.classList.remove('mem-editing');
  renderMemories();
}

async function saveMemoryEdit(id) {
  const el = document.getElementById("me_" + id);
  if (!el) return;
  const newContent = el.value.trim();
  if (!newContent) return;
  const kwEl = document.getElementById("mk_" + id);
  const impEl = document.getElementById("mi_" + id);
  const kwStr = kwEl ? kwEl.value.trim() : '';
  const kwArr = kwStr ? kwStr.split(/[,，]/).map(s => s.trim()).filter(Boolean) : [];
  const imp = impEl ? parseFloat(impEl.value) : null;
  const body = { content: newContent, keywords: JSON.stringify(kwArr) };
  if (imp != null && !isNaN(imp)) body.importance = Math.max(0, Math.min(1, imp));
  try {
    await api("PUT", `/api/memories/${id}`, body);
    const mem = _allMemories.find(m => m.id === id);
    if (mem) { mem.content = newContent; mem.keywords = body.keywords; if (body.importance != null) mem.importance = body.importance; }
    document.querySelector('.sub-page').classList.remove('editing-focus');
    renderMemories();
  } catch(e) { alert("保存失败"); }
}

async function deleteMemory(id) {
  if (!confirm("确定删除这条记忆？")) return;
  try {
    await api("DELETE", `/api/memories/${id}`);
    _allMemories = _allMemories.filter(m => m.id !== id);
    _memOffset = _allMemories.length;
    renderMemories();
  } catch(e) { alert("删除失败"); }
}

const _unresolvedLocked = new Set();
async function toggleUnresolved(id) {
  if (_unresolvedLocked.has(id)) return;
  _unresolvedLocked.add(id);

  // 乐观更新：立即翻转本地状态并重渲染，让 UI 瞬间响应
  const mem = _allMemories.find(m => m.id === id);
  if (mem) mem.unresolved = !mem.unresolved;
  renderMemories();

  try {
    const result = await api("PATCH", `/api/memories/${id}/unresolved`);
    // 用服务端返回值校正（防止本地与服务端不一致）
    if (mem) mem.unresolved = result.unresolved;
    renderMemories();
  } catch(e) {
    // 请求失败：回滚本地状态
    if (mem) mem.unresolved = !mem.unresolved;
    renderMemories();
    alert("切换失败");
  } finally {
    // 冷却 600ms 后才允许再次点击
    setTimeout(() => _unresolvedLocked.delete(id), 600);
  }
}

async function addMemory() {
  const content = $("memAddInput").value.trim();
  if (!content) return;
  const type = $("memAddType").value;
  try {
    const mem = await api("POST", "/api/memories", { content, type });
    $("memAddInput").value = "";
    prependMemory(mem);
  } catch(e) { alert("添加失败"); }
}

async function triggerDigest() {
  const btn = $("digestBtn");
  const statusEl = $("digestStatus");
  btn.disabled = true;
  btn.textContent = "⏳ 正在总结...";
  statusEl.style.display = "block";
  statusEl.className = "digest-status info";
  statusEl.textContent = "正在分析新消息并生成记忆摘要，请稍候...";
  try {
    const result = await api("POST", "/api/memories/digest");
    if (result.new_memories_count > 0) {
      statusEl.className = "digest-status success";
      statusEl.textContent = result.message;
      await loadMemories();
    } else {
      statusEl.className = "digest-status info";
      statusEl.textContent = result.message;
    }
    loadAnchor();
  } catch(e) {
    statusEl.className = "digest-status error";
    statusEl.textContent = "总结失败：" + (e.message || "未知错误");
  } finally {
    btn.disabled = false;
    btn.textContent = "📝 总结新记忆";
    setTimeout(() => { statusEl.style.display = "none"; }, 5000);
  }
}

async function viewSource(memId) {
  $("sourceOverlay").classList.add("show");
  const listEl = $("sourceList");
  listEl.innerHTML = '<div class="mem-empty">加载中...</div>';
  try {
    const result = await api("GET", `/api/memories/${memId}/source`);
    if (!result.ok || !result.messages || !result.messages.length) {
      listEl.innerHTML = '<div class="mem-empty">' + (result.message || "没有找到原文记录") + '</div>';
      return;
    }
    listEl.innerHTML = result.messages.map(m => {
      const timeStr = m.created_at ? new Date(m.created_at * 1000).toLocaleString("zh-CN", {month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit"}) : "";
      return `<div class="source-msg"><span class="source-name">${escHtml(m.name)}</span><span class="source-time">${escHtml(timeStr)}</span><div style="margin-top:4px;white-space:pre-wrap;word-break:break-word;">${escHtml(m.content)}</div></div>`;
    }).join("");
  } catch(e) { listEl.innerHTML = '<div class="mem-empty">加载失败</div>'; }
}
function closeSource() { $("sourceOverlay").classList.remove("show"); }

function switchMemoryPanel(name) {
  document.querySelectorAll('.mem-tab').forEach(tab => tab.classList.toggle('active', tab.dataset.memTab === name));
  document.querySelectorAll('.mem-panel').forEach(panel => panel.classList.toggle('active', panel.dataset.memPanel === name));
  if (name === 'debug' || name === 'vows') location.hash = name;
  else if (location.hash === '#debug' || location.hash === '#vows') history.replaceState(null, '', location.pathname);
  if (name === 'vows') loadVows();  // 每次切入都重拉，防止显示过期状态
}

function parseRecallKeywords() {
  return ($('recallKeywords').value || '')
    .split(/[,，、\s]+/)
    .map(s => s.trim())
    .filter(Boolean);
}

function fillRecallExample() {
  $('recallQuery').value = '我之前为什么想重构记忆库？';
  $('recallKeywords').value = '记忆库, 重构, 项目';
  $('recallMode').value = 'normal';
  $('recallNamespace').value = '';
  $('recallTopK').value = '8';
}

function recallCell(value) {
  if (value === null || value === undefined || value === '') return '-';
  if (Array.isArray(value)) return value.length ? value.join(', ') : '-';
  if (typeof value === 'object') return JSON.stringify(value);
  return String(value);
}

function renderRecallBadge(label, value, cls='') {
  return `<span class="recall-badge ${cls}"><span>${escHtml(label)}</span><strong>${escHtml(recallCell(value))}</strong></span>`;
}

function renderRecallSummary(trace) {
  const cls = trace.selected_count > 0 ? 'ok' : 'warn';
  return `<div class="recall-section"><h3>决策摘要</h3><div class="recall-summary">
    ${renderRecallBadge('query_type', trace.classification?.query_type || 'normal')}
    ${renderRecallBadge('needs_memory', trace.turn_plan?.needs_memory ? 'true' : 'false', trace.turn_plan?.needs_memory ? 'ok' : 'warn')}
    ${renderRecallBadge('namespace', trace.turn_plan?.namespace || 'normal')}
    ${renderRecallBadge('allowed', trace.allowed_namespaces || [])}
    ${renderRecallBadge('candidates', trace.candidate_count ?? 0)}
    ${renderRecallBadge('selected', trace.selected_count ?? 0, cls)}
    ${renderRecallBadge('abstain', trace.abstain_reason || '-', trace.abstain_reason ? 'warn' : 'ok')}
  </div></div>`;
}

function renderRecallSteps(trace) {
  const steps = trace.steps || [];
  const html = steps.map(step => `<details class="recall-step">
    <summary><span class="recall-step-name">${escHtml(step.name || '-')}</span><span class="recall-step-status">${escHtml(step.status || '-')}</span></summary>
    <pre class="recall-json">${escHtml(JSON.stringify(step.data || {}, null, 2))}</pre>
  </details>`).join('') || '<div class="mem-empty">无步骤</div>';
  return `<div class="recall-section"><h3>决策步骤</h3>${html}</div>`;
}

function renderScoreBar(score) {
  const n = Math.max(0, Math.min(1, Number(score) || 0));
  return `<div class="recall-score-bar"><span style="width:${Math.round(n * 100)}%"></span></div>`;
}

function renderRecallItemRows(items) {
  return (items || []).map(item => {
    const id = item.legacy_memory_id || item.id || '-';
    const secondary = item.secondary_namespaces && item.secondary_namespaces.length
      ? item.secondary_namespaces.map(ns => `<span class="recall-tag">${escHtml(ns)}</span>`).join('') : '';
    return `<div class="recall-item">
      <div class="recall-item-head">
        <div><div class="recall-score">${escHtml(recallCell(item.score))}</div>${renderScoreBar(item.score)}</div>
        <div>
          <div class="recall-tags">
            <span class="recall-tag ns">${escHtml(item.namespace || '-')}</span>
            <span class="recall-tag">${escHtml(item.kind || '-')}</span>
            <span class="recall-tag">${escHtml(id)}</span>
            ${secondary}
          </div>
          <div class="recall-reason">${escHtml(item.reason || '-')}</div>
          <div class="recall-preview">${escHtml(item.preview || '')}</div>
        </div>
      </div>
    </div>`;
  }).join('');
}

function renderRecallItems(title, items, emptyText) {
  const rows = renderRecallItemRows(items);
  if (!rows) return `<div class="recall-section"><h3>${escHtml(title)}</h3><div class="mem-empty">${escHtml(emptyText)}</div></div>`;
  return `<div class="recall-section"><h3>${escHtml(title)}</h3><div class="recall-items">${rows}</div></div>`;
}

function renderDebugTop(trace) {
  const rows = renderRecallItemRows(trace.debug_top || []);
  const content = rows ? `<div class="recall-items">${rows}</div>` : '<div class="mem-empty">没有候选</div>';
  return `<details class="recall-section"><summary style="cursor:pointer;font-size:13px;color:var(--text)">候选排名 debug_top</summary><div style="margin-top:8px">${content}</div></details>`;
}

function renderRecallTrace(trace) {
  $('recallOutput').innerHTML = [
    renderRecallSummary(trace),
    renderRecallSteps(trace),
    renderRecallItems('实际召回', trace.selected || [], '没有选中记忆'),
    renderDebugTop(trace),
    `<div class="recall-raw"><details><summary>Raw JSON</summary><pre class="recall-json">${escHtml(JSON.stringify(trace, null, 2))}</pre></details></div>`
  ].join('');
}

async function runRecallDebug() {
  const query = $('recallQuery').value.trim();
  if (!query) { showToast('请输入 query'); $('recallQuery').focus(); return; }
  const btn = $('recallRunBtn');
  btn.disabled = true;
  btn.textContent = '运行中';
  $('recallOutput').innerHTML = '<div class="recall-empty">正在分析...</div>';
  try {
    const topK = Math.max(1, Math.min(20, parseInt($('recallTopK').value || '8', 10)));
    const trace = await api('POST', '/api/memories/v2/trace-recall', {
      query,
      keywords: parseRecallKeywords(),
      mode: $('recallMode').value || 'normal',
      namespace: $('recallNamespace').value || null,
      top_k: topK,
      candidate_limit: 500
    });
    if (trace.detail) throw new Error(typeof trace.detail === 'string' ? trace.detail : JSON.stringify(trace.detail));
    renderRecallTrace(trace);
  } catch(e) {
    $('recallOutput').innerHTML = `<div class="digest-status error" style="display:block">trace 失败：${escHtml(e.message || '未知错误')}</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = '运行';
  }
}

async function loadAnchor() {
  try {
    const res = await api("GET", "/api/memories/digest/anchor");
    $("anchorDate").textContent = res.anchor_date || "--";
  } catch(e) { $("anchorDate").textContent = "加载失败"; }
}

async function resetAnchor() {
  const dateVal = $("anchorDateInput").value;
  if (!dateVal) { alert("请先选择要回退到的日期"); return; }
  if (!confirm(`确定将总结锚点回退到 ${dateVal}？`)) return;
  try {
    const res = await api("POST", "/api/memories/digest/anchor", { date: dateVal });
    if (res.ok) {
      $("anchorDate").textContent = res.anchor_date;
      $("anchorDateInput").value = "";
      showToast("✅ 锚点已回退到 " + res.anchor_date);
    } else { alert(res.message || "回退失败"); }
  } catch(e) { alert("回退失败"); }
}

/* ── 誓约管理（设计 §8）：新建/修订/退役/兑现/版本史，无原地编辑 ── */
let _vows = [];
let _vowsLoaded = false;
let _vowEditingId = null;
let _vowBusy = false;  // in-flight 守卫：防双击立约/重复提交
const _vowHistoryOpen = new Set();

async function _vowOp(fn) {
  if (_vowBusy) return;
  _vowBusy = true;
  const btn = $('vowAddBtn');
  if (btn) btn.disabled = true;
  try { await fn(); }
  finally {
    _vowBusy = false;
    if (btn) btn.disabled = false;
  }
}

let _vowLoading = false;
let _vowReloadQueued = false;
let _vowGeneration = 0;
let _vowFulfilledHasMore = false;
let _vowFulfilledNextOffset = null;
let _vowFulfilledLoading = false;
const VOW_PAGE_SIZE = 50;
const _vowChainCache = new Map();  // root_id → 分页版本链状态
const _vowChainLoading = new Map();  // root_id → 当前代次的请求令牌

async function loadVows() {
  // 单飞 + 排队：同一时刻只有一个 GET 在途，期间收到的变更事件
  // 合并成一次补拉——旧响应不可能覆盖新状态（§13-4 竞态）
  if (_vowLoading) { _vowReloadQueued = true; return; }
  _vowLoading = true;
  try {
    const res = await api('GET', `/api/vows?fulfilled_limit=${VOW_PAGE_SIZE}&fulfilled_offset=0`);
    if (res && res.ok) {
      _vows = res.items || [];
      _vowsLoaded = true;
      _vowFulfilledHasMore = !!res.fulfilled_has_more;
      _vowFulfilledNextOffset = res.fulfilled_next_offset;
      _vowFulfilledLoading = false;
      const generation = ++_vowGeneration;
      _vowChainCache.clear();
      renderVows();
      await _reloadOpenVowHistories(generation);
    }
  } catch(e) { console.error('加载誓约失败:', e); }
  finally {
    _vowLoading = false;
    if (_vowReloadQueued) { _vowReloadQueued = false; loadVows(); }
  }
}

function _vowDate(ts) {
  const d = new Date(ts * 1000);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function _vowOriginLabel(v) { return v.root_origin_type === 'ai_marker' ? '她立的' : '亲手立下'; }

function _vowHistoryHtml(rootId) {
  // 版本史按需拉取（toggleVowHistory 里 GET chain）：除当前版本外，新在前；
  // superseded 行的 closed_reason 即修订原因
  const page = _vowChainCache.get(rootId);
  if (!page) return '<div class="vow-history"><div class="vow-history-item">版本史加载中...</div></div>';
  if (page.error) {
    return `<div class="vow-history"><div class="vow-history-item">版本史加载失败</div>` +
      `<button class="vow-load-more" onclick="retryVowHistory('${escHtml(rootId)}')">重试</button></div>`;
  }
  const olds = page.items.slice(0, -1).reverse();
  if (!olds.length) return '';
  const history = olds.map((v, i) => {
    const ver = page.total - 1 - i;
    const reason = v.closed_reason ? `<span class="vh-reason">修订原因：${escHtml(v.closed_reason)}</span>` : '';
    return `<div class="vow-history-item">第${ver}版（${_vowDate(v.created_at)}）：${escHtml(v.content)}<br>${reason}</div>`;
  }).join('');
  const more = page.has_more
    ? `<div class="vow-load-row"><button class="vow-load-more" onclick="loadMoreVowHistory('${escHtml(rootId)}')"${_vowChainLoading.has(rootId) ? ' disabled' : ''}>${_vowChainLoading.has(rootId) ? '加载中...' : '加载更早版本'}</button></div>`
    : '';
  return `<div class="vow-history">${history}${more}</div>`;
}

function _vowCardHtml(tip) {
  const id = escHtml(tip.id);
  const root = escHtml(tip.root_id);
  const versions = tip.version_count || 1;
  const ver = versions > 1 ? ` · 第${versions}版` : '';
  const fulfilled = tip.status === 'fulfilled';
  const meta = fulfilled
    ? `${_vowOriginLabel(tip)} · ${_vowDate(tip.root_created_at)} 立 · ${_vowDate(tip.status_changed_at)} 兑现${ver}`
    : `${_vowOriginLabel(tip)} · ${_vowDate(tip.root_created_at)}${ver}`;
  let actions = '';
  if (!fulfilled && _vowEditingId !== tip.id) {
    actions = `<div class="vow-actions">
      <button class="vow-btn" onclick="fulfillVow('${id}')">✓ 兑现</button>
      <button class="vow-btn" onclick="startVowRevise('${id}')">✎ 修订</button>
      <button class="vow-btn danger" onclick="retireVow('${id}')">⏏ 退役</button>
      ${versions > 1 ? `<button class="vow-btn" onclick="toggleVowHistory('${root}')">版本史</button>` : ''}
    </div>`;
  } else if (fulfilled && versions > 1) {
    actions = `<div class="vow-actions"><button class="vow-btn" onclick="toggleVowHistory('${root}')">版本史</button></div>`;
  }
  let revise = '';
  if (_vowEditingId === tip.id) {
    revise = `<div class="vow-revise-form">
      <textarea class="vow-input" id="vowReviseContent" maxlength="240">${escHtml(tip.content)}</textarea>
      <input class="vow-input" id="vowReviseReason" maxlength="240" placeholder="修订原因（必填）">
      <div class="vow-actions">
        <button class="vow-btn" onclick="submitVowRevise('${id}')">确认修订</button>
        <button class="vow-btn" onclick="cancelVowRevise()">取消</button>
      </div>
    </div>`;
  }
  const history = _vowHistoryOpen.has(tip.root_id) ? _vowHistoryHtml(tip.root_id) : '';
  return `<div class="vow-card${fulfilled ? ' fulfilled' : ''}">
    <div class="vow-content">${escHtml(tip.content)}</div>
    <div class="vow-meta">${meta}</div>
    ${actions}${revise}${history}
  </div>`;
}

function renderVows() {
  // WS 事件可能在用户填修订表单时触发重渲染：先存草稿，渲染后还原
  let draft = null;
  if (_vowEditingId && $('vowReviseContent')) {
    draft = { content: $('vowReviseContent').value, reason: $('vowReviseReason') ? $('vowReviseReason').value : '' };
  }
  // 接口只返回链尾（active / fulfilled）；retired 链不在管理页展示
  const active = _vows.filter(v => v.status === 'active');
  const fulfilled = _vows.filter(v => v.status === 'fulfilled');
  $('vowActiveCount').textContent = active.length ? `(${active.length})` : '';
  $('vowActiveList').innerHTML = active.length
    ? active.map(v => _vowCardHtml(v)).join('')
    : '<div class="mem-empty">还没有誓约</div>';
  $('vowFulfilledList').innerHTML = fulfilled.length
    ? fulfilled.map(v => _vowCardHtml(v)).join('')
    : '<div class="mem-empty">还没有兑现的誓约</div>';
  if (_vowFulfilledHasMore || _vowFulfilledLoading) {
    $('vowFulfilledList').innerHTML += `<div class="vow-load-row"><button class="vow-load-more" onclick="loadMoreFulfilledVows()"${_vowFulfilledLoading ? ' disabled' : ''}>${_vowFulfilledLoading ? '加载中...' : '加载更多'}</button></div>`;
  }
  if (draft && $('vowReviseContent')) {
    $('vowReviseContent').value = draft.content;
    $('vowReviseReason').value = draft.reason;
  }
}

async function createVow() {
  await _vowOp(async () => {
    const input = $('vowAddInput');
    const content = (input.value || '').trim();
    if (!content) return;
    try {
      const res = await api('POST', '/api/vows', { content });
      if (!res || res.ok === false) { showToast('⚠️ ' + ((res && res.error) || '立约失败')); await loadVows(); return; }
      input.value = '';
      showToast('🕯️ 已立约');
      await loadVows();
    } catch(e) { showToast('⚠️ 立约失败'); }
  });
}

async function fulfillVow(id) {
  if (!confirm('确认这条誓约已经兑现？')) return;
  await _vowOp(async () => {
    try {
      const res = await api('POST', `/api/vows/${id}/fulfill`);
      if (!res || res.ok === false) { showToast('⚠️ ' + ((res && res.error) || '操作失败')); }
      await loadVows();  // 失败多半是卡片过期，刷新拿回真实状态
    } catch(e) { showToast('⚠️ 操作失败'); }
  });
}

async function retireVow(id) {
  const reason = (prompt('退役原因（必填）：') || '').trim();
  if (!reason) return;
  await _vowOp(async () => {
    try {
      const res = await api('POST', `/api/vows/${id}/retire`, { reason });
      if (!res || res.ok === false) { showToast('⚠️ ' + ((res && res.error) || '操作失败')); }
      await loadVows();
    } catch(e) { showToast('⚠️ 操作失败'); }
  });
}

function startVowRevise(id) { _vowEditingId = id; renderVows(); }
function cancelVowRevise() { _vowEditingId = null; renderVows(); }

async function submitVowRevise(id) {
  const content = ($('vowReviseContent').value || '').trim();
  const reason = ($('vowReviseReason').value || '').trim();
  if (!content) { showToast('⚠️ 内容不能为空'); return; }
  if (!reason) { showToast('⚠️ 修订必须填写原因'); return; }
  await _vowOp(async () => {
    try {
      const res = await api('POST', `/api/vows/${id}/revise`, { content, reason });
      if (!res || res.ok === false) { showToast('⚠️ ' + ((res && res.error) || '修订失败')); await loadVows(); return; }
      _vowEditingId = null;
      showToast('✎ 已修订');
      await loadVows();
    } catch(e) { showToast('⚠️ 修订失败'); }
  });
}

async function toggleVowHistory(rootId) {
  if (_vowHistoryOpen.has(rootId)) { _vowHistoryOpen.delete(rootId); renderVows(); return; }
  _vowHistoryOpen.add(rootId);
  renderVows();
  await _loadVowChain(rootId);
}

async function _loadVowChain(rootId, append = false) {
  const generation = _vowGeneration;
  const activeRequest = _vowChainLoading.get(rootId);
  if (activeRequest && activeRequest.generation === generation) return false;
  const current = _vowChainCache.get(rootId);
  const offset = append && current ? current.next_offset : 0;
  if (append && (offset === null || offset === undefined)) return true;
  const requestToken = { generation };
  _vowChainLoading.set(rootId, requestToken);
  renderVows();
  try {
    const res = await api('GET', `/api/vows/${encodeURIComponent(rootId)}/chain?limit=${VOW_PAGE_SIZE}&offset=${offset}`);
    if (generation !== _vowGeneration || !_vowHistoryOpen.has(rootId)) return false;
    if (!res || !res.ok) throw new Error((res && res.error) || '版本史请求失败');
    let items = res.items || [];
    if (append && current) {
      const seen = new Set(current.items.map(v => v.id));
      items = items.filter(v => !seen.has(v.id)).concat(current.items);
    }
    _vowChainCache.set(rootId, {
      items,
      total: Number(res.total) || items.length,
      has_more: !!res.has_more,
      next_offset: res.next_offset,
      error: false,
    });
    return true;
  } catch(e) {
    if (generation === _vowGeneration && _vowHistoryOpen.has(rootId)) {
      if (!append) _vowChainCache.set(rootId, { items: [], total: 0, has_more: false, next_offset: null, error: true });
      console.error('加载版本史失败:', e);
    }
    return false;
  } finally {
    if (_vowChainLoading.get(rootId) === requestToken) _vowChainLoading.delete(rootId);
    if (generation === _vowGeneration) renderVows();
  }
}

async function _reloadOpenVowHistories(generation) {
  const visibleRoots = new Set(_vows.filter(v => (v.version_count || 1) > 1).map(v => v.root_id));
  const roots = [..._vowHistoryOpen].filter(rootId => {
    if (visibleRoots.has(rootId)) return true;
    _vowHistoryOpen.delete(rootId);
    return false;
  });
  if (generation !== _vowGeneration) return;
  await Promise.all(roots.map(rootId => _loadVowChain(rootId)));
}

async function retryVowHistory(rootId) {
  _vowChainCache.delete(rootId);
  renderVows();
  await _loadVowChain(rootId);
}

async function loadMoreVowHistory(rootId) {
  await _loadVowChain(rootId, true);
}

async function loadMoreFulfilledVows() {
  if (_vowFulfilledLoading || !_vowFulfilledHasMore || _vowFulfilledNextOffset === null) return;
  const generation = _vowGeneration;
  _vowFulfilledLoading = true;
  renderVows();
  try {
    const res = await api('GET', `/api/vows?fulfilled_limit=${VOW_PAGE_SIZE}&fulfilled_offset=${_vowFulfilledNextOffset}`);
    if (generation !== _vowGeneration || !res || !res.ok) return;
    const seen = new Set(_vows.map(v => v.id));
    const nextItems = (res.fulfilled_items || []).filter(v => !seen.has(v.id));
    _vows = _vows.concat(nextItems);
    _vowFulfilledHasMore = !!res.fulfilled_has_more;
    _vowFulfilledNextOffset = res.fulfilled_next_offset;
  } catch(e) { console.error('加载更多已兑现誓约失败:', e); }
  finally {
    if (generation === _vowGeneration) {
      _vowFulfilledLoading = false;
      renderVows();
    }
  }
}
</script>
