services:
  obsidian-vow:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: obsidian-chat/Dockerfile
    image: obsidian-vow:latest
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      OBSIDIAN_BIND_HOST: "0.0.0.0"
      OBSIDIAN_BIND_PORT: "18080"
      OBSIDIAN_SIGNAL_DAILY_TIMEZONE: "${OBSIDIAN_SIGNAL_DAILY_TIMEZONE:-UTC}"
    ports:
      - "127.0.0.1:18080:18080"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18080/healthz', timeout=4).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
