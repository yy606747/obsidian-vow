<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script src="/static/brand_compat.js?v=20260905-brand"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>心语 - Obsidian Vow</title>
<link rel="stylesheet" href="/static/common.css">
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#13151d">
<style>
.hw-list { flex:1; overflow-y:auto; max-height:calc(100dvh - 120px); padding:4px 0; }
.hw-empty { padding:60px 24px; text-align:center; color:var(--text3); font-size:14px; line-height:2; }
.hw-card {
  position: relative;
  background: linear-gradient(135deg, var(--surface) 0%, rgba(42,36,32,0.95) 100%);
  border: 1px solid var(--border);
  border-left: 2px solid rgba(212,148,58,0.25);
  border-radius: 12px;
  padding: 14px 16px;
  margin-bottom: 10px;
  transition: box-shadow 0.3s, border-color 0.3s, transform 0.2s;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}
.hw-card:hover {
  box-shadow: 0 4px 20px rgba(212,148,58,0.1), 0 2px 8px rgba(0,0,0,0.2);
  border-left-color: var(--accent);
  transform: translateX(2px);
}
.hw-time { font-size: 11px; color: var(--text3); font-family: monospace; margin-bottom: 6px; }
.hw-content { font-size: 14px; color: var(--text); line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
.hw-del {
  position: absolute;
  top: 10px;
  right: 10px;
  background: none;
  border: none;
  color: var(--text3);
  font-size: 14px;
  cursor: pointer;
  padding: 4px 6px;
  border-radius: 4px;
  opacity: 0;
  transition: opacity 0.2s, color 0.2s;
}
.hw-card:hover .hw-del { opacity: 1; }
.hw-del:hover { color: var(--danger); }
.hw-load-more {
  display: block;
  margin: 12px auto;
  padding: 8px 24px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text2);
  font-size: 13px;
  cursor: pointer;
}
.hw-load-more:hover { background: var(--border); }
.hw-stats { text-align: center; font-size: 12px; color: var(--text3); padding: 8px 0; }
</style>
<link rel="stylesheet" href="/static/vow.css?v=20260913-enamel">
<script src="/static/vow.js?v=20260913-gold-dust"></script>
<link rel="stylesheet" href="/static/gold-dust.css?v=20260913-gold-dust">
<script src="/static/gold-dust.js?v=20260913-gold-dust" defer></script>
</head>
<body>
<div class="sub-page">
  <div class="top-bar">
    <button class="back-btn" onclick="location.href='/'">⬅</button>
    <h2>💭 心语</h2>
  </div>
  <div class="page-content">
    <div class="hw-list" id="hwList">
      <div class="hw-empty">暂无心语</div>
    </div>
  </div>
</div>
<script src="/static/common.js?v=20260913-refined"></script>
<script src="/static/web_push.js?v=20260905-brand"></script>
<script>
const PAGE_SIZE = 20;
let currentPage = 1;
let totalItems = 0;
let allItems = [];

async function loadWhispers(page = 1, append = false) {
  try {
    const res = await api('GET', `/api/heart-whispers?page=${page}&page_size=${PAGE_SIZE}`);
    totalItems = res.total;
    if (append) {
      allItems = allItems.concat(res.items);
    } else {
      allItems = res.items;
    }
    currentPage = page;
    renderList();
  } catch (e) {
    console.error('加载心语失败:', e);
  }
}

function renderList() {
  const container = document.getElementById('hwList');
  if (!allItems.length) {
    container.innerHTML = '<div class="hw-empty">暂无心语</div>';
    return;
  }
  let html = '';
  for (const item of allItems) {
    const d = new Date(item.created_at * 1000);
    const timeStr = d.toLocaleDateString('zh-CN', {year:'numeric',month:'long',day:'numeric'}) + ' · ' + d.toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit',hour12:false});
    html += `<div class="hw-card" data-id="${item.id}">
      <button class="hw-del" onclick="deleteWhisper('${item.id}')" title="删除">✕</button>
      <div class="hw-time">${timeStr}</div>
      <div class="hw-content">${escapeHtml(item.content)}</div>
    </div>`;
  }
  html += `<div class="hw-stats">共 ${totalItems} 条心语</div>`;
  if (allItems.length < totalItems) {
    html += `<button class="hw-load-more" onclick="loadMore()">加载更多</button>`;
  }
  container.innerHTML = html;
}

function loadMore() {
  loadWhispers(currentPage + 1, true);
}

async function deleteWhisper(id) {
  if (!confirm('确定删除这条心语吗？')) return;
  try {
    await api('DELETE', `/api/heart-whispers/${id}`);
    try { window.parent.ChatHeartNotes?.remove(id); } catch (_) {}
    allItems = allItems.filter(i => i.id !== id);
    totalItems--;
    renderList();
  } catch (e) {
    console.error('删除失败:', e);
  }
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// The shared socket also receives events forwarded by the chat iframe host.
connectCommonWS(msg => {
  if (msg.type !== 'heart_whisper' || !msg.data?.id) return;
  if (allItems.some(item => item.id === msg.data.id)) return;
  allItems.unshift(msg.data);
  totalItems++;
  renderList();
});

loadWhispers();
</script>
</body>
</html>
