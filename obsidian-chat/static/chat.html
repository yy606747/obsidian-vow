<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script src="/static/brand_compat.js?v=20260905-brand"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Obsidian Vow</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/public/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#13151d">
<link rel="stylesheet" href="/static/chat.css?v=20261010-continuity">
<link rel="stylesheet" href="/static/vow.css?v=20260920-together-room">
<link rel="stylesheet" href="/static/scene-controls.css?v=20260926-scene-layout">
<link rel="stylesheet" href="/static/heart-notes.css?v=20260913-avatar-details">
<link rel="stylesheet" href="/static/markdown.css?v=20261009-math">
<link rel="stylesheet" href="/static/documents.css?v=20260913-documents">
<script src="/static/vow.js?v=20260920-companion-names"></script>
<link rel="stylesheet" href="/static/gold-dust.css?v=20260913-gold-dust">
<script src="/static/gold-dust.js?v=20260913-gold-dust" defer></script>
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="vow-conv-label">聊天记录</span>
      <button data-action="newConversation">+ 新对话</button>
      <button class="settings-btn" data-action="openFileManager" aria-label="聊天文件" data-vow-icon="folder"></button>
      <button class="settings-btn" data-action="openSubPage" data-subpage="/settings" aria-label="设置" data-vow-icon="settings"></button>
    </div>
    <div class="conv-list" id="convList"></div>
    <div class="sidebar-footer">
      <details>
        <summary><span data-vow-icon="heart"></span>亲密与工具</summary>
        <div>
          <button data-action="openWhisper"><span data-vow-icon="heart"></span>密语</button>
          <button data-action="openAiDom"><span data-vow-icon="lock"></span>亲密控制</button>
          <button data-action="openTide"><span data-vow-icon="wave"></span>潮汐</button>
          <button data-action="openSubPage" data-subpage="/scenes"><span data-vow-icon="lock"></span>小剧场</button>
          <button id="togetherOpen"><span data-vow-icon="heart"></span>相伴</button>
          <button data-action="openSubPage" data-subpage="/devices"><span data-vow-icon="devices"></span>设备面板</button>
          <button id="sysLogBtn" data-action="openSystemLog"><span data-vow-icon="log"></span>系统日志</button>
          <button data-action="openSubPage" data-subpage="/"><span data-vow-icon="home"></span>返回小屋</button>
        </div>
      </details>
      <button type="button" data-vow-tools><span data-vow-icon="more"></span>日常与设置</button>
    </div>
  </aside>
  <div class="overlay" id="overlay" data-action="closeSidebar"></div>

  <div class="modal-overlay" id="sysLogModal">
    <div class="modal syslog-modal">
      <h3>📋 系统日志</h3>
      <div class="syslog-count" id="sysLogCount">共 0 条（刷新后清空）</div>
      <div class="syslog-list" id="sysLogList">
        <div class="syslog-empty">暂无日志</div>
      </div>
      <div class="btn-row">
        <button class="btn-cancel" data-action="clearSystemLog">清空</button>
        <button class="btn-cancel" data-action="closeSystemLog">关闭</button>
      </div>
    </div>
  </div>









  <div class="alarm-overlay" id="alarmOverlay">
    <div class="alarm-box">
      <div class="alarm-icon">⏰</div>
      <h3>日程提醒</h3>
      <div class="alarm-content" id="alarmContent"></div>
      <div class="alarm-time" id="alarmTime"></div>
      <button data-action="dismissAlarm">确认</button>
    </div>
  </div>

  <main class="chat-area">
    <div class="chat-header">
      <button class="home-btn" data-action="openSubPage" data-subpage="/" title="返回小屋" aria-label="返回小屋" data-vow-icon="back"></button>
      <img class="chat-person-avatar" id="chatPersonAvatar" src="/api/avatar/ai" alt="" width="42" height="42">
      <div class="chat-heading">
        <div class="chat-person-name" id="chatPersonName">Obsidian Vow</div>
        <div class="title" id="chatTitle" data-action="renameCurrent" role="button" tabindex="0" title="重命名当前对话">聊天</div>
      </div>
      <button class="menu-btn" data-action="openSidebar" aria-label="打开聊天记录" data-vow-icon="menu"></button>
      <div class="tts-toggle" title="自动语音播放">
        <span class="tts-label" data-vow-icon="volume"></span>
        <label class="toggle-switch">
          <input type="checkbox" id="ttsToggle" aria-label="自动语音播放">
          <span class="toggle-slider"></span>
        </label>
      </div>
      <button class="config-btn" data-action="toggleConfig" aria-label="聊天与语音设置" data-vow-icon="settings"></button>
    </div>
    <div id="sceneGlobalChatSlot" class="scene-control-slot">
      <section id="sceneGlobalBar" class="scene-global-bar" aria-label="小剧场控制" hidden>
        <span id="sceneGlobalStatus" role="status"></span>
        <div class="scene-global-actions">
          <button type="button" id="sceneGlobalOpen">返回场景</button>
          <button type="button" id="sceneGlobalPause">暂停</button>
          <button type="button" id="sceneGlobalEnd">停止设备</button>
        </div>
      </section>
    </div>
    <div class="config-popup" id="configPopup">
      <label>模型</label>
      <select id="modelSelect"></select>
      <label>当天上下文数量</label>
      <div class="slider-row">
        <input type="range" id="contextSlider" min="1" max="100" value="30">
        <span class="slider-val" id="contextValue">30条</span>
      </div>
      <label><input type="checkbox" id="dailyChatEnabled" checked> 每日凌晨开启新对话</label>
      <small id="dailyChatTime"></small>
      <label>跨日继承数量</label>
      <div class="slider-row">
        <input type="range" id="dailyContextSlider" min="1" max="100" value="30">
        <span class="slider-val" id="dailyContextValue">30条</span>
      </div>
      <small>保留到当天结束，数量调整从下次切窗生效。</small>
      <label>模型温度</label>
      <div class="slider-row">
        <input type="range" id="tempSlider" min="0" max="2" step="0.1" value="1">
        <span class="slider-val" id="tempValue">1</span>
      </div>
      <div class="cam-section">
        <div class="cam-section-title">◈ 语音合成 (TTS)</div>
        <div class="tts-voice-row">
          <label>音色</label>
          <select id="ttsVoiceSelect"><option value="">加载中...</option></select>
          <button class="tts-refresh-btn" data-action="refreshTTSVoices" title="刷新音色列表">🔄</button>
        </div>
      </div>
      <div class="cam-section">
        <div class="cam-section-title">🎙 语音唤醒 (通话模式)</div>
        <div class="cam-toggle-row">
          <span class="cam-toggle-label">语音监听</span>
          <label class="toggle-switch">
            <input type="checkbox" id="voiceToggle">
            <span class="toggle-slider"></span>
          </label>
        </div>
        <div class="cam-config-row">
          <label>麦克风</label>
          <select class="voice-config-control" id="voiceMicSource">
            <option value="local">🖥 本机 (PC后端)</option>
            <option value="remote">📱 手机麦克风</option>
          </select>
        </div>
        <div class="cam-config-row">
          <label>唤醒词</label>
          <input class="voice-config-control" type="text" id="voiceWakeWord" value="老公">
        </div>
        <div class="cam-status" id="voiceStatus">未开启</div>
      </div>
    </div>
    <div class="context-bar">
      <span class="context-label">上下文:</span>
      <input type="range" min="1" max="100" value="20">
      <span>20 条</span>
    </div>
    <div class="voice-indicator" id="voiceIndicator">
      <span class="voice-pulse"></span>
      <span id="voiceIndicatorText">语音监听中...</span>
      <button class="voice-hangup-btn" data-action="voiceHangup" id="voiceHangupBtn">挂断</button>
    </div>
    <div class="messages" id="messages"></div>
    <div class="input-area">
      <div class="together-chat-notice" id="togetherChatNotice" role="status" hidden>
        <span id="togetherChatStatus">正在相伴中。</span>
        <button type="button" id="togetherResume">返回相伴</button>
      </div>
      <section class="sticker-panel" id="stickerPanel" aria-label="表情面板" hidden>
        <div class="sticker-panel-header">
          <strong>我的表情 <span id="stickerCount"></span></strong>
          <div>
            <button type="button" id="stickerAddBtn" data-sticker-action="add">＋ 添加表情</button>
            <button type="button" id="stickerManageBtn" data-sticker-action="manage" aria-pressed="false" disabled>管理</button>
            <button type="button" id="stickerRefreshBtn" data-sticker-action="refresh" aria-label="刷新表情">↻</button>
            <button type="button" data-sticker-action="close" aria-label="收起表情面板">✕</button>
          </div>
        </div>
        <div class="sticker-grid" id="stickerGrid" aria-live="polite"></div>
        <div class="sticker-manage-bar" id="stickerManageBar" hidden>
          <span id="stickerSelectedCount" role="status">已选 0 张</span>
          <button type="button" id="stickerSelectAllBtn" data-sticker-action="select-all">全选</button>
          <button type="button" id="stickerRemoveBtn" data-sticker-action="remove" disabled>移除</button>
        </div>
        <input class="hidden-file-input" type="file" id="stickerFileInput" accept="image/png,image/jpeg,image/webp,image/gif" multiple>
      </section>
      <div class="preview-area" id="previewArea"></div>
      <div class="input-row" id="textInputRow">
        <button class="upload-btn" data-action="chooseUpload" title="发送图片、视频或文件" aria-label="发送图片、视频或文件" data-vow-icon="plus"></button>
        <input class="hidden-file-input" type="file" id="fileInput" accept="image/*,video/*,.pdf,.txt,.docx,.md,application/pdf,text/plain,text/markdown,application/vnd.openxmlformats-officedocument.wordprocessingml.document" multiple>
        <button class="upload-btn sticker-toggle" id="stickerToggle" data-action="toggleStickers" title="发送表情" aria-label="发送表情" aria-controls="stickerPanel" aria-expanded="false" data-vow-icon="smile"></button>
        <button class="voice-mode-btn" id="voiceMessageToggle" data-voice-action="voice-mode" title="发送语音消息" aria-label="发送语音消息" data-vow-icon="mic"></button>
        <textarea id="input" rows="1" placeholder="说点什么…" aria-label="聊天消息"></textarea>
        <button class="send-btn" id="sendBtn" data-action="send" aria-label="发送消息" data-vow-icon="send" disabled></button>
      </div>
      <div class="voice-record-row" id="voiceRecordRow" aria-hidden="true">
        <button class="voice-mode-btn" data-voice-action="text-mode" title="切回文字输入">⌨</button>
        <button class="voice-hold-btn" id="voiceHoldBtn" data-voice-action="hold">按住 说话</button>
        <span class="voice-record-time" id="voiceRecordTime">0:00</span>
      </div>
    </div>
  </main>
</div>

<!-- ── 子页面 iframe 浮层（保持聊天页存活，SSE/TTS 不中断） ── -->
<div id="subPageOverlay">
  <div id="subPageBar">
    <button type="button" data-vow-home aria-label="返回小屋" title="返回小屋" data-vow-icon="back"></button>
    <span id="subPageTitle"></span>
  </div>
  <div id="sceneGlobalSubpageSlot" class="scene-control-slot"></div>
  <iframe id="subPageFrame" sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-modals"></iframe>
</div>
