plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'app.obsidianvow.core'
    compileSdk 35

    defaultConfig {
        applicationId "app.obsidianvow.core"
        minSdk 26       // Health Connect 需要 API 26+
        targetSdk 34
        versionCode 11
        versionName "1.0.10"
    }

    buildTypes {
        debug {
            if (project.hasProperty('sceneDevicePilot')) versionNameSuffix '-scene-pilot'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/togetherAssets')
}

// Bundle the exact renderer used by daily chat. The floating transcript is offline;
// no CDN, duplicate parser implementation, or server page is involved.
def togetherMarkdownAssets = tasks.register('togetherMarkdownAssets', Sync) {
    into layout.buildDirectory.dir('generated/togetherAssets/together/shared')
    from('../../obsidian-chat/static/js/chat') { include 'markdown.js' }
    from('../../obsidian-chat/static/vendor') {
        include 'markdown-it.min.js', 'dompurify.min.js', '*.LICENSE', 'markdown-vendor.json'
    }
}
tasks.named('preBuild').configure { dependsOn togetherMarkdownAssets }

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.8.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Kotlin 协程（Health Connect SDK 需要）
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Health Connect — 读取小米手环同步过来的心率/睡眠/步数/SpO2
    // alpha10 的 AAR metadata 要求 compileSdk 35；targetSdk 仍固定 34，
    // 这里只升级编译工具，不改变运行时行为 opt-in。
    implementation 'androidx.health.connect:connect-client:1.1.0-alpha10'

    testImplementation 'junit:junit:4.13.2'
}
