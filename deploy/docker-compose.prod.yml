name: obsidian-vow

services:
  app:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: aion-chat/Dockerfile
    image: ${AION_RELEASE_IMAGE:-obsidian-vow:prod}
    container_name: obsidian-vow
    restart: unless-stopped
    network_mode: host
    env_file:
      - ../.env
    environment:
      AION_BIND_HOST: "127.0.0.1"
      AION_BIND_PORT: "18080"
      AION_SIGNAL_DAILY_TIMEZONE: "${AION_SIGNAL_DAILY_TIMEZONE:-UTC}"
      HOME: "/tmp"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    user: "${AION_UID:-1000}:${AION_GID:-1000}"
    volumes:
      - ../aion-chat/data:/app/data
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18080/healthz', timeout=4).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
